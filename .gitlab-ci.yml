# GitLab CI. The GitHub Actions workflow in .github/workflows/ci.yml does not
# run here, so this is the same discipline expressed for a different runner:
# lint, typecheck and the full suite on the two Node versions the package
# supports, then a scan of this repository's own MCP config.
#
# Kept deliberately close to the GitHub workflow. Two CI definitions that drift
# apart are worse than one, because the second becomes a place where failures
# are ignored rather than a second opinion.

stages:
  - verify
  - scan

default:
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

.node:
  stage: verify
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run typecheck
    - npm run test

test:node20:
  extends: .node
  image: node:20-alpine

test:node22:
  extends: .node
  image: node:22-alpine

# Scans the repo's own MCP configuration with the build under test, which is
# the closest thing to a real user's first run. It reports rather than gates:
# `--fail-on critical` keeps an unrelated medium finding from blocking a merge,
# and the SARIF artifact is kept either way.
scan:self:
  stage: scan
  image: node:22-alpine
  needs: ['test:node22']
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - node dist/cli/index.js scan --format sarif --output guardmcp.sarif --fail-on critical
  artifacts:
    when: always
    paths:
      - guardmcp.sarif
    expire_in: 30 days
