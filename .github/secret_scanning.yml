# guardmcp's own test suite intentionally contains realistic-shaped fake
# secrets (GitHub/Slack/AWS/OpenAI token formats) — that's what MCPG-101
# scans for. GitHub's secret scanning flags these as if they were real leaks.
# Excluding the test tree is the standard approach security-scanner projects
# (gitleaks, trufflehog) use for this exact conflict — production source
# under src/ is NOT excluded and stays fully scanned.
paths-ignore:
  - "tests/**"
